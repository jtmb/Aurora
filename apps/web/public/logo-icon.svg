<?xml version="1.0" encoding="UTF-8"?>
<!-- 
  Aurora Gateway Logo - Icon/Favicon Version (32x32)  
  Optimized for browser tabs and small displays
-->
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aurora Gateway Logo">
  <defs>
    <!-- Aurora gradient: indigo to cyan -->
    <linearGradient id="aurora-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Simplified "A" for small size - optimized for favicon -->
  <path d="M7,25 L10.5,21 L14,25 L14,28 H11 L11,23 L7,25 Z" 
        fill="url(#aurora-gradient)" opacity="0.9"/>
</svg>
