# Override cache location to skip secure_link validation.
# Cache requests come through our Next.js proxy which handles auth.
# Port 80 requests hit DS directly (no proxy), so CORS headers are needed.
location ~* ^(\/cache\/files.*)(\/.*) {
  alias /var/lib/onlyoffice/documentserver/App_Data$1;
  add_header Content-Disposition "attachment; filename*=UTF-8''$arg_filename";
  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
  # No secure_link - proxy handles access control
}