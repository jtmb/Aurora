# Aurora Gateway — services
# SQLite database (aurora.db) is created automatically by the application.

services:
  # ---- Orchestrator API (code-server headless) ----
  code-server:
    build:
      context: ../code-server
      dockerfile: Dockerfile.slim
    ports:
      - "${CODE_SERVER_API_PORT:-3001}:3001"
      - "${CODE_SERVER_PORT:-8080}:8080"
    volumes:
      - ${HOME:-~}/.aurora/workspaces:/workspaces
      - cline-config:/home/coder/.cline
      - cline-hooks:/tmp/cline-hooks
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LMSTUDIO_URL=${LMSTUDIO_URL:-http://host.docker.internal:1234/v1}
      - LMSTUDIO_MODEL=${LMSTUDIO_MODEL:-qwen-coder}
      - LMSTUDIO_API_KEY=${LMSTUDIO_API_KEY:-sk-lm-studio}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - ORCHESTRATOR_PLAN_FIRST=${ORCHESTRATOR_PLAN_FIRST:-true}
      - CLINE_TIMEOUT=${CLINE_TIMEOUT:-600}
      - MAX_ITERATIONS=${MAX_ITERATIONS:-50}
      - CODE_SERVER_API_PORT=${CODE_SERVER_API_PORT:-3001}
      - CODE_SERVER_PORT=${CODE_SERVER_PORT:-8080}
      - ORCHESTRATOR_CORS_ORIGIN=${ORCHESTRATOR_CORS_ORIGIN:-http://localhost:3000}
    command: ["both"]
    restart: unless-stopped

  onlyoffice-document-server:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice-ds
    ports:
      - "${ONLYOFFICE_DS_PORT:-8082}:80"
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - JWT_ENABLED=false
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_fonts:/usr/share/fonts
      - ./config/onlyoffice/local.json:/etc/onlyoffice/documentserver/local.json
      - ./config/onlyoffice/ds-cache-override.conf:/etc/nginx/includes/ds-cache-override.conf
    mem_limit: 2g
    restart: unless-stopped

volumes:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_fonts:
  cline-config:
  cline-hooks:
